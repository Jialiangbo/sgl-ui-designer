[package]
name = "sgl-ui-designer"
version = "0.1.5"
description = "SGL UI Designer - Visual embedded GUI design tool"
authors = ["SGL UI Designer Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
freetype-rs = { version = "0.38", default-features = false, features = ["bundled"] }
# 禁用 freetype-sys 的 libpng（避免 zlib 依赖）
freetype-sys = { version = "0.23", default-features = false, features = ["bundled"] }
once_cell = "1.19"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
# 使用本地 vendor 版本，移除 libpng 编译依赖（避免 Windows 下 zlib.h 缺失）
freetype-sys = { path = "vendor/freetype-sys" }

[package.metadata.tauri]
bundle = { active = false, targets = "all" }
